[build]
  publish = "dist"
  command = "npm ci && npm run build:netlify"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  CI = "true"
  VITE_SITE_URL = "https://baydarandbaydar.com"
  VITE_API_BASE_URL = "https://api.baydarandbaydar.com"
  VITE_COMPANY_EMAIL = "baydarandbaydar@gmail.com"
  VITE_COMPANY_PHONE = "+90 533 869 2852"
  VITE_GOOGLE_ANALYTICS_ID = ""

# Build optimization - DISABLED to prevent conflicts with Vite
[build.processing]
  skip_processing = true

# SPA redirect for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy (if needed in the future)
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.baydarandbaydar.com/:splat"
#   status = 200
#   force = true

# Security headers - RELAXED for debugging
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Performance headers
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
    Link = "</assets/fonts/AbhayaLibre-Regular.ttf>; rel=preload; as=font; type=font/ttf; crossorigin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML with shorter duration
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Edge functions for dynamic content
[[edge_functions]]
  function = "geolocation"
  path = "/api/location"

# RUM metrics collection endpoint
[[edge_functions]]
  function = "rum"
  path = "/api/rum"

# Image optimization redirects
[[redirects]]
  from = "/images/*"
  to = "/.netlify/images?url=:splat"
  status = 200
