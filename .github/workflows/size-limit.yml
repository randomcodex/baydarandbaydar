name: Bundle Size Limit

on:
  pull_request:
    branches: [ main ]

jobs:
  size-limit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (CI)
        run: npm ci

      - name: Run size limit
        run: npm run size-limit

      - name: Fail if limits exceeded
        if: failure()
        run: echo "Bundle size limit exceeded" && exit 1
