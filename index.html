    <script>
      (function(){
        const ua = navigator.userAgent.toLowerCase();
        const isSpecialWebView = ua.includes('instagram') || ua.includes('facebook');
        const nav = performance.getEntriesByType('navigation')[0];
        const metrics = nav ? {
          ttfb: Math.round(nav.responseStart - nav.requestStart),
          domInteractive: Math.round(nav.domInteractive - nav.startTime),
          domContentLoaded: Math.round(nav.domContentLoadedEventEnd - nav.startTime)
        } : {};
        let lcpEntry; try {
          const po = new PerformanceObserver(list => {
            const entries = list.getEntries();
            lcpEntry = entries[entries.length - 1];
          });
          po.observe({ type: 'largest-contentful-paint', buffered: true });
        } catch(e) {}
        function send(){
          if(!isSpecialWebView) return;
          const payload = {
            ua: navigator.userAgent,
            ttfb: metrics.ttfb,
            domInteractive: metrics.domInteractive,
            domContentLoaded: metrics.domContentLoaded,
            lcp: lcpEntry ? Math.round(lcpEntry.startTime) : undefined,
            ts: Date.now()
          };
          const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
          if (navigator.sendBeacon) {
            navigator.sendBeacon('/api/rum', blob);
          } else {
            fetch('/api/rum', { method:'POST', body: blob, keepalive: true });
          }
        }
        window.addEventListener('load', () => { setTimeout(send, 0); });
        window.addEventListener('visibilitychange', () => { if(document.visibilityState==='hidden') send(); });
      })();
    </script>
