<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Baydar & Baydar - Premium Italian wine imports. Discover exceptional wines from Italy's finest vineyards."
    />
    <meta
      name="keywords"
      content="Italian wine, premium wine, wine import, Baydar, wine dispensers"
    />
    <meta name="theme-color" content="#8B0000" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://baydarandbaydar.com" />
    <meta property="og:title" content="Baydar & Baydar - Premium Italian Wine Imports" />
    <meta
      property="og:description"
      content="Discover exceptional wines from Italy's finest vineyards"
    />
    <meta property="og:image" content="https://baydarandbaydar.com/assets/images/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://baydarandbaydar.com" />
    <meta property="twitter:title" content="Baydar & Baydar - Premium Italian Wine Imports" />
    <meta
      property="twitter:description"
      content="Discover exceptional wines from Italy's finest vineyards"
    />
    <meta
      property="twitter:image"
      content="https://baydarandbaydar.com/assets/images/og-image.jpg"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://baydarandbaydar.com" />

    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Baydar & Baydar",
        "url": "https://baydarandbaydar.com",
        "description": "Premium Italian wine imports",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+1-555-0123",
          "contactType": "customer service",
          "email": "info@baydarandbaydar.com"
        },
        "sameAs": ["https://www.linkedin.com/company/baydarandbaydar"]
      }
    </script>

    <title>Baydar & Baydar - Premium Italian Wine Imports</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
